<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Leather Bound Gradient -->
    <linearGradient id="leatherGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c1e12" />
      <stop offset="50%" stop-color="#28130a" />
      <stop offset="100%" stop-color="#190a04" />
    </linearGradient>

    <!-- Antique Gold Foil Gradient -->
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8022" />
    </linearGradient>

    <!-- Warm Parchment -->
    <linearGradient id="parchmentFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9f0" />
      <stop offset="100%" stop-color="#e9ddca" />
    </linearGradient>

    <!-- Wax Seal Gradient -->
    <radialGradient id="waxSealFav" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c94436" />
      <stop offset="70%" stop-color="#8c2317" />
      <stop offset="100%" stop-color="#54120a" />
    </radialGradient>
  </defs>

  <!-- Leather Outer Book Shape -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="url(#leatherGradFav)" stroke="#190a04" stroke-width="6" />
  
  <!-- Outer Gold Stitching Border -->
  <rect x="44" y="44" width="424" height="424" rx="56" fill="none" stroke="url(#goldGradFav)" stroke-width="4" stroke-dasharray="10,6" />
  <rect x="58" y="58" width="396" height="396" rx="44" fill="none" stroke="url(#goldGradFav)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Open Parchment Folio Leaves -->
  <path d="M 88 110 C 180 96, 256 114, 256 118 C 256 114, 332 96, 424 110 L 424 402 C 332 388, 256 406, 256 402 C 256 406, 180 388, 88 402 Z" fill="url(#parchmentFav)" stroke="#d3c3a9" stroke-width="3" />
  
  <!-- Folio Center Gutter Spine Line -->
  <line x1="256" y1="118" x2="256" y2="402" stroke="#b39f82" stroke-width="4" />

  <!-- Left Folio Red Ink Margin & Accounting Ruled Lines -->
  <line x1="140" y1="130" x2="140" y2="380" stroke="#a63428" stroke-width="3.5" />
  <line x1="105" y1="175" x2="235" y2="175" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="105" y1="225" x2="235" y2="225" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="105" y1="275" x2="235" y2="275" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="105" y1="325" x2="235" y2="325" stroke="#a63428" stroke-width="3" />
  <line x1="105" y1="333" x2="235" y2="333" stroke="#a63428" stroke-width="3" />

  <!-- Right Folio Green Ink Margin & Accounting Ruled Lines -->
  <line x1="372" y1="130" x2="372" y2="380" stroke="#265c3b" stroke-width="3.5" />
  <line x1="277" y1="175" x2="407" y2="175" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="277" y1="225" x2="407" y2="225" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="277" y1="275" x2="407" y2="275" stroke="#cbbca6" stroke-width="2.5" />
  <line x1="277" y1="325" x2="407" y2="325" stroke="#265c3b" stroke-width="3" />
  <line x1="277" y1="333" x2="407" y2="333" stroke="#265c3b" stroke-width="3" />

  <!-- Center Archival Red Wax Seal -->
  <circle cx="256" cy="256" r="64" fill="url(#waxSealFav)" stroke="#4a0f07" stroke-width="4" />
  <circle cx="256" cy="256" r="54" fill="none" stroke="url(#goldGradFav)" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Embossed Gilded "L" Monogram in Seal -->
  <text x="256" y="278" text-anchor="middle" fill="#faecc5" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="900">
    L
  </text>
</svg>
