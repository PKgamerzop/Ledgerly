<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Leather Bound Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c1e12" />
      <stop offset="50%" stop-color="#28130a" />
      <stop offset="100%" stop-color="#190a04" />
    </linearGradient>

    <!-- Antique Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8022" />
      <stop offset="100%" stop-color="#dfbc5e" />
    </linearGradient>

    <!-- Warm Parchment Left Page Gradient -->
    <linearGradient id="parchmentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0e4d0" />
      <stop offset="85%" stop-color="#fcf9f2" />
      <stop offset="100%" stop-color="#dfd0ba" />
    </linearGradient>

    <!-- Warm Parchment Right Page Gradient -->
    <linearGradient id="parchmentRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ded0bb" />
      <stop offset="15%" stop-color="#fdfbf5" />
      <stop offset="100%" stop-color="#ede1cd" />
    </linearGradient>

    <!-- Brass Nib Gradient -->
    <linearGradient id="brassNib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="50%" stop-color="#cda33d" />
      <stop offset="100%" stop-color="#805b12" />
    </linearGradient>

    <!-- Wax Seal Gradient -->
    <radialGradient id="waxSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c94436" />
      <stop offset="70%" stop-color="#8c2317" />
      <stop offset="100%" stop-color="#54120a" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="bookShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="pageShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#140803" flood-opacity="0.35" />
    </filter>

    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Leather Outer Book Cover -->
  <rect x="24" y="24" width="464" height="464" rx="56" fill="url(#leatherGrad)" stroke="#190a04" stroke-width="4" filter="url(#bookShadow)" />
  
  <!-- Outer Gold Foil Stitched Border -->
  <rect x="38" y="38" width="436" height="436" rx="46" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,4" stroke-opacity="0.85" />
  
  <!-- Inner Gold Filigree Frame -->
  <rect x="52" y="52" width="408" height="408" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- 1920s Corner Flourishes (Gold filigree triangles/accents) -->
  <!-- Top Left -->
  <path d="M 54 84 L 84 54 M 54 94 L 94 54 M 64 64 L 74 64 L 64 74 Z" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)" fill-opacity="0.4" />
  <!-- Top Right -->
  <path d="M 458 84 L 428 54 M 458 94 L 418 54 M 448 64 L 438 64 L 448 74 Z" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)" fill-opacity="0.4" />
  <!-- Bottom Left -->
  <path d="M 54 428 L 84 458 M 54 418 L 94 458 M 64 448 L 74 448 L 64 438 Z" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)" fill-opacity="0.4" />
  <!-- Bottom Right -->
  <path d="M 458 428 L 428 458 M 458 418 L 418 458 M 448 448 L 438 448 L 448 438 Z" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)" fill-opacity="0.4" />

  <!-- Outer Folio Header Label -->
  <text x="256" y="85" text-anchor="middle" fill="url(#goldGrad)" font-family="Merriweather, 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" letter-spacing="4">
    GENERAL LEDGER &#8226; 1926
  </text>

  <!-- Open Physical Accounting Book Canvas -->
  <g filter="url(#pageShadow)">
    <!-- Book Backing Leaves Edge -->
    <path d="M 76 122 C 160 114, 256 126, 256 128 C 256 126, 352 114, 436 122 L 440 398 C 352 388, 256 400, 256 398 C 256 400, 160 388, 72 398 Z" fill="#d3c3a9" />

    <!-- Left Page (Debit Ledger) -->
    <path d="M 82 126 C 165 119, 254 130, 254 132 L 254 394 C 254 394, 165 383, 78 392 Z" fill="url(#parchmentLeft)" />

    <!-- Right Page (Credit Ledger) -->
    <path d="M 258 132 C 258 130, 347 119, 430 126 L 434 392 C 347 383, 258 394, 258 394 Z" fill="url(#parchmentRight)" />

    <!-- Book Spine Gutter Shadow -->
    <path d="M 251 131 C 254 133, 256 133, 261 131 L 261 395 C 256 393, 254 393, 251 395 Z" fill="#bfae95" opacity="0.8" />
  </g>

  <!-- Left Page: Ruled Ledger Lines & Debit Red Ink -->
  <!-- Header rule -->
  <line x1="94" y1="165" x2="242" y2="165" stroke="#9a8167" stroke-width="1.5" />
  <!-- Red vertical accounting margin lines -->
  <line x1="126" y1="150" x2="126" y2="370" stroke="#a63428" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="198" y1="150" x2="198" y2="370" stroke="#a63428" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="202" y1="150" x2="202" y2="370" stroke="#a63428" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Left Page Column Labels -->
  <text x="110" y="160" text-anchor="middle" fill="#8c2317" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">DATE</text>
  <text x="162" y="160" text-anchor="middle" fill="#8c2317" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">FOLIO / DEBIT</text>
  <text x="222" y="160" text-anchor="middle" fill="#8c2317" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">RED INK</text>

  <!-- Left Page Ledger Entry Rows (Faint blue/sepia ruled lines) -->
  <line x1="94" y1="192" x2="242" y2="192" stroke="#cfc0a8" stroke-width="1" />
  <text x="100" y="186" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 12</text>
  <text x="132" y="186" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Disbursed</text>
  <text x="238" y="186" text-anchor="end" fill="#a63428" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">- 42.50</text>

  <line x1="94" y1="219" x2="242" y2="219" stroke="#cfc0a8" stroke-width="1" />
  <text x="100" y="213" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 14</text>
  <text x="132" y="213" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Supplies</text>
  <text x="238" y="213" text-anchor="end" fill="#a63428" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">- 18.00</text>

  <line x1="94" y1="246" x2="242" y2="246" stroke="#cfc0a8" stroke-width="1" />
  <text x="100" y="240" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 18</text>
  <text x="132" y="240" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Freight</text>
  <text x="238" y="240" text-anchor="end" fill="#a63428" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">- 95.20</text>

  <line x1="94" y1="273" x2="242" y2="273" stroke="#cfc0a8" stroke-width="1" />
  <line x1="94" y1="300" x2="242" y2="300" stroke="#cfc0a8" stroke-width="1" />
  <line x1="94" y1="327" x2="242" y2="327" stroke="#cfc0a8" stroke-width="1" />

  <!-- Double red accounting rule at bottom of left page -->
  <line x1="132" y1="344" x2="242" y2="344" stroke="#a63428" stroke-width="1.5" />
  <line x1="132" y1="348" x2="242" y2="348" stroke="#a63428" stroke-width="1.5" />
  <text x="134" y="340" fill="#4d3221" font-family="Georgia, serif" font-size="9" font-weight="700">SUBTOTAL</text>
  <text x="238" y="340" text-anchor="end" fill="#a63428" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="800">- 155.70</text>

  <!-- Right Page: Ruled Ledger Lines & Credit Green Ink -->
  <!-- Header rule -->
  <line x1="270" y1="165" x2="418" y2="165" stroke="#9a8167" stroke-width="1.5" />
  <!-- Green vertical accounting margin lines -->
  <line x1="302" y1="150" x2="302" y2="370" stroke="#265c3b" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="374" y1="150" x2="374" y2="370" stroke="#265c3b" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="378" y1="150" x2="378" y2="370" stroke="#265c3b" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Right Page Column Labels -->
  <text x="286" y="160" text-anchor="middle" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">DATE</text>
  <text x="338" y="160" text-anchor="middle" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">CREDIT / NOTE</text>
  <text x="398" y="160" text-anchor="middle" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">AMOUNT</text>

  <!-- Right Page Ledger Rows -->
  <line x1="270" y1="192" x2="418" y2="192" stroke="#cfc0a8" stroke-width="1" />
  <text x="276" y="186" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 10</text>
  <text x="308" y="186" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Deposit</text>
  <text x="414" y="186" text-anchor="end" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">+ 350.00</text>

  <line x1="270" y1="219" x2="418" y2="219" stroke="#cfc0a8" stroke-width="1" />
  <text x="276" y="213" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 15</text>
  <text x="308" y="213" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Settled</text>
  <text x="414" y="213" text-anchor="end" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">+ 120.00</text>

  <line x1="270" y1="246" x2="418" y2="246" stroke="#cfc0a8" stroke-width="1" />
  <text x="276" y="240" fill="#755a45" font-family="Georgia, serif" font-size="9" font-style="italic">Oct 20</text>
  <text x="308" y="240" fill="#2b170e" font-family="Georgia, serif" font-size="9.5" font-weight="600">Retainer</text>
  <text x="414" y="240" text-anchor="end" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="700">+ 500.00</text>

  <line x1="270" y1="273" x2="418" y2="273" stroke="#cfc0a8" stroke-width="1" />
  <line x1="270" y1="300" x2="418" y2="300" stroke="#cfc0a8" stroke-width="1" />
  <line x1="270" y1="327" x2="418" y2="327" stroke="#cfc0a8" stroke-width="1" />

  <!-- Double green accounting rule at bottom of right page -->
  <line x1="308" y1="344" x2="418" y2="344" stroke="#265c3b" stroke-width="1.5" />
  <line x1="308" y1="348" x2="418" y2="348" stroke="#265c3b" stroke-width="1.5" />
  <text x="310" y="340" fill="#4d3221" font-family="Georgia, serif" font-size="9" font-weight="700">TOTAL</text>
  <text x="414" y="340" text-anchor="end" fill="#265c3b" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="800">+ 970.00</text>

  <!-- Wax Seal in Bottom Right Page -->
  <g filter="url(#pageShadow)" transform="translate(350, 275)">
    <circle cx="28" cy="28" r="26" fill="url(#waxSeal)" stroke="#4a0f07" stroke-width="2" />
    <circle cx="28" cy="28" r="21" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,2" stroke-opacity="0.8" />
    <!-- Embossed L monogram -->
    <text x="28" y="36" text-anchor="middle" fill="#faecc5" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="900" letter-spacing="1">
      L
    </text>
  </g>

  <!-- Brass Dip Pen Resting Diagonally Across Spine -->
  <g filter="url(#penShadow)">
    <!-- Pen Barrel (Ebonite Wood / Dark Espresso) -->
    <path d="M 230 380 L 330 190 L 338 194 L 238 384 Z" fill="#1c0e07" stroke="#4a2613" stroke-width="1" />
    
    <!-- Gold Ferrule Ring -->
    <path d="M 233 374 L 243 355 L 249 358 L 239 377 Z" fill="url(#brassNib)" />

    <!-- Vintage Gold Pen Nib -->
    <!-- Point pointing towards left page -->
    <path d="M 233 374 L 210 415 L 208 418 L 222 400 L 239 377 Z" fill="url(#brassNib)" stroke="#805b12" stroke-width="0.8" />
    
    <!-- Nib Ink Split & Breathing Hole -->
    <circle cx="225" cy="390" r="1.8" fill="#140703" />
    <line x1="225" y1="390" x2="208" y2="418" stroke="#140703" stroke-width="1" />

    <!-- Tiny drop of red ink at nib point -->
    <circle cx="206" cy="421" r="3.2" fill="#a63428" />
  </g>

  <!-- Bottom Brand Plaque / Title -->
  <g transform="translate(136, 420)">
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#190a04" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="120" y="21" text-anchor="middle" fill="#faecc5" font-family="'Playfair Display', Merriweather, Georgia, serif" font-size="14" font-weight="700" letter-spacing="3">
      LEDGERLY
    </text>
  </g>
</svg>
