<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ledgerly - Spending & Debt Tracker</title>
    <meta name="description" content="Track personal spending, manage debts with friends, and export monthly reports." />
    
    <!-- PWA Web Manifest & Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme and Mobile Standalone Display (Prevents browser shortcut logo badge) -->
    <meta name="theme-color" content="#0c3744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <meta name="application-name" content="Ledgerly" />
    <meta name="format-detection" content="telephone=no" />

    <!-- OpenGraph & Twitter Cards -->
    <meta property="og:title" content="Ledgerly - Spending & Debt Tracker" />
    <meta property="og:description" content="Track personal spending, manage debts with friends, and export monthly reports." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ledgerly - Spending & Debt Tracker" />
    <meta name="twitter:description" content="Track personal spending, manage debts with friends, and export monthly reports." />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    
    <!-- Modern Web Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA offline capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Ledgerly ServiceWorker registered successfully: ', reg.scope);
            })
            .catch((err) => {
              console.log('Ledgerly ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
